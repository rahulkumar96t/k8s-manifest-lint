# A node agent that asks for everything: privileged, host namespaces and
# the host filesystem, running as root with an untagged image.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
    spec:
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsUser: 0
      initContainers:
        - name: setup
          image: busybox
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: agent
          image: artifactory.example.com/docker-local/node-agent:3.1.0
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 9100}
          readinessProbe:
            httpGet: {path: /healthz, port: 9100}
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: root
              mountPath: /host
      volumes:
        - name: root
          hostPath:
            path: /
