# A replicated cache: StatefulSet + headless Service + PDB that selects
# with matchExpressions instead of matchLabels.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: shop
spec:
  replicas: 3
  serviceName: cache
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: redis
          image: artifactory.example.com/docker-local/redis:7.2.5
          args: ["--save", "", "--appendonly", "no"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: shop
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cache
  ports:
    - port: 6379
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cache
  namespace: shop
spec:
  minAvailable: 2
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [cache]
