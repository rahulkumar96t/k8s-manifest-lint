# Batch work as a List (the shape `kubectl get -o yaml` produces).
# Jobs and CronJobs do not need probes.
apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: db-migrate
      namespace: shop
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: shop
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: migrate
              image: 111111111111.dkr.ecr.eu-west-1.amazonaws.com/my-app/migrate:1.4.2
              resources:
                requests: {cpu: 100m, memory: 64Mi}
                limits: {memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: nightly-report
      namespace: shop
      labels:
        app.kubernetes.io/name: nightly-report
        app.kubernetes.io/part-of: shop
    spec:
      schedule: "0 2 * * *"
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
              containers:
                - name: report
                  image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/my-app/report:2.0.1
                  resources:
                    requests: {cpu: 500m, memory: 256Mi}
                    limits: {memory: 512Mi}
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
